<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>孙子读书卡 · 十三篇</title>
  <meta name="description" content="孙子兵法全文读书卡：十三篇原文、句读导读、通俗讲解、名家对比与背诵卡。" />
  <script id="theme-bootstrap">
    (() => {
      const themes = ["paper", "celadon", "night"];
      const valid = (theme) => themes.includes(theme);
      const query = new URLSearchParams(location.search).get("theme");
      let stored = null;

      try {
        stored = localStorage.getItem("sunzi:theme");
      } catch {}

      const theme = valid(query) ? query : valid(stored) ? stored : "paper";

      if (valid(query)) {
        try {
          localStorage.setItem("sunzi:theme", query);
        } catch {}
      }

      if (theme === "paper") {
        document.documentElement.removeAttribute("data-theme");
      } else {
        document.documentElement.setAttribute("data-theme", theme);
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="ink-wash" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#home" data-nav="home">孙子读书卡</a>
    <nav class="nav">
      <button type="button" data-nav="home">首页</button>
      <button type="button" data-nav="list">十三篇</button>
      <button type="button" data-nav="essence">兵法精要</button>
      <button type="button" data-nav="method">读法</button>
    </nav>
    <label class="search">
      <span class="sr-only">搜索</span>
      <input id="searchInput" type="search" placeholder="搜篇名 / 原文 / 关键词…" autocomplete="off" />
    </label>
    <fieldset class="theme-switcher" aria-label="阅读主题">
      <legend class="sr-only">阅读主题</legend>
      <label class="theme-option theme-option-paper" title="宣纸">
        <input type="radio" name="theme" value="paper" />
        <span class="theme-swatch" aria-hidden="true"></span>
        <span>宣纸</span>
      </label>
      <label class="theme-option theme-option-celadon" title="青瓷">
        <input type="radio" name="theme" value="celadon" />
        <span class="theme-swatch" aria-hidden="true"></span>
        <span>青瓷</span>
      </label>
      <label class="theme-option theme-option-night" title="夜读">
        <input type="radio" name="theme" value="night" />
        <span class="theme-swatch" aria-hidden="true"></span>
        <span>夜读</span>
      </label>
    </fieldset>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <p>经文为古代公版文献；白话讲解与名家对比为导读综述，便于学习战略思维，不是教人欺诈或伤害他人的指南。</p>
  </footer>

  <script src="js/theme.mjs" type="module"></script>
  <script src="js/app.js" type="module"></script>
  <script src="/reading-room.js?v=2" defer></script>
</body>
</html>
