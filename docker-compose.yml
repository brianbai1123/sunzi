# 孙子读书卡 · 本机 Docker 部署
#
# 启动:  ./docker-start.sh   或  docker compose up -d
# 停止:  ./docker-stop.sh    或  docker compose down
# 访问:  http://localhost:8766

services:
  sunzi:
    image: python:3.12-alpine
    container_name: sunzi-reading-cards
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8766:8766"
    command: ["python", "scripts/live_server.py", "--host", "0.0.0.0", "--port", "8766"]
    restart: unless-stopped
